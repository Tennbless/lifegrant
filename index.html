const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ago=t=>{const m=(Date.now()-t)/6e4;return m<1?'Just now':m<60?Math.floor(m)+' min ago':m<1440?Math.floor(m/60)+' hr ago':new Date(t).toLocaleDateString()};

const fresh=()=>({view:'home',tab:'overview',filter:'All',q:'',aq:'',legal:null,welcome:false,loading:false,ep:null,del:null,note:null,sent:false,linkErr:false});
let ME=null,posts=[],people=[],st=Object.assign(fresh(),{loading:true}),chan=null,lastAct=Date.now(),fails=0,lock=0,rt=null;
const me=()=>ME;
async function loadPosts(){const[a,b]=await Promise.all([sb.from('posts').select('*').order('created_at',{ascending:false}).limit(200),sb.from('reactions').select('post_id,user_id')]);const m={};(b.data||[]).forEach(r=>{(m[r.post_id]=m[r.post_id]||[]).push(r.user_id)});posts=(a.data||[]).map(p=>({id:p.id,uid:p.author_id,name:p.author_name,type:p.type,text:p.body,t:Date.parse(p.created_at),team:p.is_team,edited:p.edited,amen:m[p.id]||[]}))}
async function loadPeople(){const[a,b]=await Promise.all([sb.from('profiles').select('*').eq('role','grantee').order('name'),sb.from('grants').select('*')]);const gm={};(b.data||[]).forEach(g=>{gm[g.user_id]=g});people=(a.data||[]).map(p=>Object.assign({},p,{grant:gm[p.id]||{}}))}
async function loadAll(){const{data:{session}}=await sb.auth.getSession();if(!session){ME=null;return}
 const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
 if(!p){await sb.auth.signOut();ME=null;return}
 ME=p;if(p.role==='grantee'){const{data:g}=await sb.from('grants').select('*').eq('user_id',p.id).maybeSingle();ME.grant=g||{}}
 await loadPosts();if(p.role==='admin')await loadPeople()}
function subscribe(){if(chan||!sb)return;const go=()=>{clearTimeout(rt);rt=setTimeout(async()=>{if(!ME)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;await loadAll();render()},500)};
 chan=sb.channel('live');['posts','reactions','grants','profiles'].forEach(t=>chan.on('postgres_changes',{event:'*',schema:'public',table:t},go));chan.subscribe()}
function unsub(){if(chan&&sb){sb.removeChannel(chan)}chan=null}
async function signOut(){Object.keys(messageDrafts).forEach(k=>delete messageDrafts[k]);unsub();if(sb)await sb.auth.signOut();ME=null;posts=[];people=[];st=fresh();render()}
async function api(body){const{data,error}=await sb.functions.invoke('admin-actions',{body});if(error){let m=error.message;try{const j=await error.context.json();m=j.error||m}catch(e){}return{error:m}}if(data&&data.error)return{error:data.error};return{data}}
async function doLogin(email,pw,want){if(Date.now()<lock)return'Too many attempts. Please wait 30 seconds and try again.';
 const{error}=await sb.auth.signInWithPassword({email:email.trim().toLowerCase(),password:pw});
 if(error){fails++;if(fails>=5){lock=Date.now()+30000;fails=0}return'Incorrect email or password.'}
 fails=0;await loadAll();
 if(!ME){return'This account is not set up for the portal. Please contact the Global Impact Team.'}
 if(ME.role!==want){await sb.auth.signOut();ME=null;return want==='admin'?'This login is for administrators only.':'Administrators, please use the administrator login.'}
 return null}

async function syncPortal(){if(!ME)return;if(liveBusy){livePending=true;return}liveBusy=true;const uid=ME.id;try{await loadAll();if(!ME||ME.id!==uid)return;const paymentDraft=document.getElementById('installmentForm')?{id:document.getElementById('installmentForm').dataset.id,revision:document.getElementById('installmentForm').dataset.revision,rows:collectPayments()}:null;const drafts=[...document.querySelectorAll('#app form[id]')].map(f=>({id:f.id,record:f.dataset.id,fields:[...f.elements].filter(e=>e.name&&e.type!=='password'&&e.type!=='file').map(e=>({name:e.name,value:e.value}))})),a=document.activeElement,fid=a?.form?.id,name=a?.name,pos=a?.selectionStart,y=scrollY;render();if(paymentDraft){const pf=document.getElementById('installmentForm');if(!pf&&people.some(p=>p.id===paymentDraft.id))editor(paymentDraft.id);const restored=document.getElementById('installmentForm');if(restored){restored.dataset.revision=paymentDraft.revision;const c=document.getElementById('installmentRows');c.innerHTML='';paymentDraft.rows.forEach(r=>addPaymentRow(c,r))}}for(const d of drafts){let f=document.getElementById(d.id);if(!f&&d.id==='gf'&&d.record&&me()?.role==='admin'){editor(d.record);f=document.getElementById(d.id)}if(f)for(const v of d.fields){const e=f.elements.namedItem(v.name);if(e&&!e.disabled)e.value=v.value}}const e=fid&&name?document.getElementById(fid)?.elements.namedItem(name):null;if(e?.focus){e.focus({preventScroll:true});if(typeof pos==='number'&&e.setSelectionRange)try{e.setSelectionRange(pos,pos)}catch(_){}}hydrateGrantDates();updatePaymentPreview();window.scrollTo(0,y)}catch(e){console.warn(e.message)}finally{liveBusy=false;if(livePending){livePending=false;queueSync()}}}
function queueSync(){clearTimeout(rt);rt=setTimeout(syncPortal,500)}
subscribe=function(){if(chan||!sb)return;chan=sb.channel('live');['profiles','grants','posts','reactions','grant_installments'].forEach(t=>chan.on('postgres_changes',{event:'*',schema:'public',table:t},queueSync));chan.subscribe(status=>{if(status==='SUBSCRIBED')queueSync()})};
const oldUnsub=unsub;unsub=function(){clearTimeout(rt);livePending=false;oldUnsub()};
window.addEventListener('online',()=>{if(ME)queueSync()});document.addEventListener('visibilitychange',()=>{if(ME&&document.visibilityState==='visible')queueSync()});setInterval(()=>{if(ME&&document.visibilityState==='visible')queueSync()},30000);


/* Installment ledger and calendar dropdowns. Run grant-installments.sql first. */
let installmentCache=[],installmentError='';
const originalLoadAll=loadAll;
loadAll=async function(){await originalLoadAll();installmentCache=[];installmentError='';if(!ME)return;for(let page=0;;page++){const r=await sb.from('grant_installments').select('*').order('user_id').order('position').range(page*1000,page*1000+999);if(r.error){installmentError=r.error.message;break}installmentCache.push(...(r.data||[]));if((r.data||[]).length<1000)break}};
function dateParts(value){return /^\d{4}-\d{2}-\d{2}$/.test(value||'')?value.split('-'):['','','']}
function hydrateGrantDates(){document.querySelectorAll('.grantDate').forEach(w=>{const input=w.querySelector('input'),[y,m,d]=dateParts(input.value);const ys=w.querySelector('[data-part=y]');if(y&&![...ys.options].some(o=>o.value===y))ys.add(new Option(y,y));ys.value=y;w.querySelector('[data-part=m]').value=m;w.querySelector('[data-part=d]').value=d})}
function convertGrantDates(root){root.querySelectorAll('input[type=date]').forEach(input=>{const wrap=document.createElement('div');wrap.className='grantDate';input.before(wrap);input.type='hidden';wrap.append(input);const year=new Date().getFullYear();wrap.insertAdjacentHTML('beforeend',`<div style="display:flex;gap:6px"><select data-part="m" aria-label="Month"><option value="">Month</option>${Array.from({length:12},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}">${new Date(2000,i,1).toLocaleString('en',{month:'short'})}</option>`).join('')}</select><select data-part="d" aria-label="Day"><option value="">Day</option>${Array.from({length:31},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}">${i+1}</option>`).join('')}</select><select data-part="y" aria-label="Year"><option value="">Year</option>${Array.from({length:81},(_,i)=>year-40+i).map(y=>`<option>${y}</option>`).join('')}</select></div>`)});hydrateGrantDates()}
document.addEventListener('change',e=>{const w=e.target.closest('.grantDate');if(!w)return;const y=w.querySelector('[data-part=y]').value,m=w.querySelector('[data-part=m]').value,d=w.querySelector('[data-part=d]').value;const valid=y&&m&&d&&Number(d)<=new Date(Number(y),Number(m),0).getDate();w.querySelector('input').value=valid?`${y}-${m}-${d}`:'';w.dataset.invalid=(!y&&!m&&!d)||valid?'':'true';w.style.outline=w.dataset.invalid?'2px solid #c33':'';updatePaymentPreview()});
function paymentMoney(n,x){const currency=x?.ct==='KE'?'KES':'USD';return new Intl.NumberFormat('en',{style:'currency',currency}).format(n)}
function cents(v){return Math.round(Number(v||0)*100)}
function summaryHTML(x,rows,amount){const award=cents(amount??x.grant?.amount),sent=rows.filter(r=>r.status==='Completed').reduce((n,r)=>n+cents(r.amount),0),scheduled=rows.reduce((n,r)=>n+cents(r.amount),0);return `<div class="grid" style="gap:12px;margin:16px 0"><div>Grant amount<h3>${paymentMoney(award/100,x)}</h3></div><div>Total sent<h3>${paymentMoney(sent/100,x)}</h3></div><div>Remaining balance<h3>${paymentMoney((award-sent)/100,x)}</h3></div><div>Scheduled total<h3>${paymentMoney(scheduled/100,x)}</h3></div></div><p>Grant status: ${esc(x.grant?.status||'Pending review')} · Reference: ${esc(x.grant?.reference_number||x.grant?.details?.grant_reference||'Not assigned')}<br>Last saved update: ${x.grant?.updated_at?esc(new Date(x.grant.updated_at).toLocaleString()):'Not recorded'}</p>${scheduled>award?'<p role="alert" style="color:#c33">Installments exceed the grant amount. Adjust the schedule or save a larger award first.</p>':''}`}
let installmentRowCounter=0;
function addPaymentRow(container,r={}){const key=++installmentRowCounter,tr=document.createElement('div');tr.className='paymentRow';tr.dataset.key=key;tr.style='border:1px solid var(--line);padding:16px;margin:12px 0;border-radius:12px';tr.innerHTML=`<h4 style="color:var(--blue)">Installment</h4><div class="grid" style="gap:12px"><div><label>Amount</label><input data-payment="amount" name="pay_${key}_amount" type="number" step="0.01" min="0.01" required value="${esc(r.amount??'')}"></div><div><label>Scheduled date</label><input data-payment="scheduled_date" name="pay_${key}_scheduled" type="date" value="${esc(r.scheduled_date||'')}"></div><div><label>Status</label><select data-payment="status" name="pay_${key}_status">${['Pending','Approved','Completed'].map(v=>`<option ${r.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>Date sent (required when Completed)</label><input data-payment="sent_date" name="pay_${key}_sent" type="date" value="${esc(r.sent_date||'')}"></div></div><label>Payment note (visible to grantee)</label><input data-payment="note" name="pay_${key}_note" maxlength="1000" value="${esc(r.note||'')}"><button type="button" class="btn line sm" data-remove-payment>Remove installment</button>`;container.append(tr);convertGrantDates(tr)}

const beforeInstallmentEditor=editor;
editor=function(id){beforeInstallmentEditor(id);const x=people.find(p=>p.id===id),f=document.querySelector('#gf');if(!x||!f)return;convertGrantDates(f);const section=document.createElement('section');section.className='card';section.style.marginTop='20px';section.innerHTML=`<h3>Grant details — payment installments</h3><p>Only Completed installments count as sent. These entries record payments; they do not transfer funds. Save the grant amount above before saving its payment schedule.</p><div id="adminPaymentSummary"></div><form id="installmentForm" data-id="${esc(id)}" data-revision="${esc(x.grant?.payment_revision??0)}"><div id="installmentRows"></div><button type="button" class="btn line" id="addInstallment">Add installment</button> <button type="submit" class="btn">Save payment schedule</button><p id="paymentResult" role="status">${esc(installmentError)}</p></form>`;f.parentElement.after(section);const rows=installmentCache.filter(p=>p.user_id===id);rows.forEach(r=>addPaymentRow(section.querySelector('#installmentRows'),r));updatePaymentPreview()};
document.addEventListener('click',e=>{if(e.target.id==='addInstallment'){addPaymentRow(document.getElementById('installmentRows'));updatePaymentPreview()}if(e.target.matches('[data-remove-payment]')){if(confirm('Remove this installment? Totals change when you save the schedule.')){e.target.closest('.paymentRow').remove();updatePaymentPreview()}}});

document.addEventListener('submit',async e=>{const f=e.target;if(f.id==='gf'){if(f.querySelector('.grantDate[data-invalid=true]')){e.preventDefault();e.stopImmediatePropagation();toast('Choose a valid complete date, or clear all three dropdowns.')}return}if(f.id!=='installmentForm')return;e.preventDefault();e.stopImmediatePropagation();const btn=f.querySelector('[type=submit]'),status=f.querySelector('[role=status]');btn.disabled=true;try{if(f.querySelector('.grantDate[data-invalid=true]'))throw Error('Complete or clear each date.');const rows=collectPayments();for(const r of rows){if(!r.scheduled_date)throw Error('Every installment needs a scheduled date.');if(r.status==='Completed'&&!r.sent_date)throw Error('Completed installments need a date sent.');if(!/^\d+(\.\d{1,2})?$/.test(r.amount)||Number(r.amount)<=0)throw Error('Use a positive amount with up to two decimal places.')}const r=await sb.rpc('save_grant_installments',{p_user_id:f.dataset.id,p_revision:Number(f.dataset.revision),p_rows:rows});if(r.error)throw r.error;status.textContent='Payment schedule saved.';await loadAll();if(f.isConnected){f.dataset.revision=String(r.data);updatePaymentPreview()}toast('Payment schedule saved; grantee totals updated.')}catch(err){status.textContent=err.message||'Unable to save schedule'}finally{if(btn.isConnected)btn.disabled=false}},true);
const beforeInstallmentRender=render;
render=function(){beforeInstallmentRender();const u=me();if(!u||u.role!=='grantee')return;const el=document.getElementById('granteePaymentSummary');if(!el)return;const rows=installmentCache.filter(r=>r.user_id===u.id);el.innerHTML=summaryHTML(u,rows)+`<p role="status">${esc(installmentError)}</p><div style="overflow:auto"><table class="tbl"><thead><tr><th>Installment</th><th>Amount</th><th>Scheduled date</th><th>Status</th><th>Date sent</th><th>Note</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${paymentMoney(r.amount,u)}</td><td>${esc(r.scheduled_date)}</td><td>${esc(r.status)}</td><td>${esc(r.sent_date||'—')}</td><td>${esc(r.note)}</td></tr>`).join('')||'<tr><td colspan="6">No installments scheduled.</td></tr>'}</tbody></table></div>`};

async function invokeFn(n,body){const{data,error}=await sb.functions.invoke(n,{body});if(error){let m=error.message;try{const j=await error.context.json();m=j.error||m}catch(e){}if(/Failed to send|not found|fetch/i.test(m))m='The send-email function could not be reached. Deploy it first (see setup notes).';return{error:m}}if(data&&data.error)return{error:data.error};return{data}}
async function sendMail(){const ids=[...SEL].filter(id=>people.some(p=>p.id===id)),subject=$('#mmS').value.trim(),body=$('#mmB').value.trim(),R=$('#mmR'),btn=$('#mmSend');
 if(!ids.length)return R.innerHTML=mnote(false,'Choose at least one recipient.');if(!subject||!body)return R.innerHTML=mnote(false,'Add a subject and a message.');
 if(ids.length>50)return R.innerHTML=mnote(false,'Send to 50 recipients or fewer at a time.');
 if(ids.length>1&&!confirm('Send this email to '+ids.length+' recipients?'))return;
 btn.disabled=true;btn.textContent='Sending…';R.innerHTML='<p class="mute">Sending, please wait…</p>';
 const r=await invokeFn('send-email',{recipients:ids,subject,body,include_link:$('#mmL').checked,site:SITE});
 if(btn.isConnected){btn.disabled=false;btn.textContent='Send email'}if(!R.isConnected)return;
 if(r.error)return R.innerHTML=mnote(false,'<b>Not sent.</b> '+esc(r.error));showResults(r.data.results||[])}
function showResults(res){const ok=res.filter(x=>x.ok),bad=res.filter(x=>!x.ok),at=new Date().toLocaleString();
 const head=!res.length?mnote(false,'No result was returned. Check Sent history before retrying.'):!bad.length?mnote(true,`<b>&#10003; Sent successfully</b> to ${ok.length} of ${res.length} recipient${res.length>1?'s':''} on ${esc(at)}. The email service accepted every message for delivery.`):ok.length?mnote(false,`<b>Partly sent:</b> ${ok.length} accepted, ${bad.length} failed.`):mnote(false,`<b>Not sent.</b> All ${bad.length} failed.`);
 $('#mmR').innerHTML=head+`<div class="scr"><table class="tbl"><tbody>${res.map(x=>`<tr><td style="color:${x.ok?'#0e9f6e':'#cf2d41'};font-weight:700">${x.ok?'&#10003;':'&#10007;'}</td><td>${esc(x.name||'')}<br><small class="mute">${esc(x.email)}</small></td><td>${x.ok?'Accepted · ref '+esc(String(x.provider_id||'').slice(0,8)):'<span style="color:#cf2d41">'+esc(x.error||'Failed')+'</span>'}</td></tr>`).join('')}</tbody></table></div>`+(bad.length?`<button class="btn line sm" style="color:var(--ink);margin-top:10px" data-mm="retry" data-ids="${esc(bad.map(x=>x.id).join(','))}">Select failed and retry</button>`:'');
 toast(bad.length?(ok.length?'Some emails failed':'Email failed'):'Email sent to '+ok.length+' recipient'+(ok.length>1?'s':''))}
async function mmHistory(){const el=$('#mmH');el.innerHTML='<p class="mute">Loading…</p>';const r=await sb.from('email_log').select('*').order('created_at',{ascending:false}).limit(100);if(!el.isConnected)return;el.innerHTML=r.error?mnote(false,esc(r.error.message)):`<div class="scr"><table class="tbl"><thead><tr><th>When</th><th>To</th><th>Subject</th><th>Result</th></tr></thead><tbody>${(r.data||[]).map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString())}</td><td>${esc(x.recipient_email)}</td><td>${esc(x.subject)}</td><td>${x.status==='sent'?'<span class="pill s1">Sent</span>':'<span class="pill" style="background:#fde8eb;color:#a3182b" title="'+esc(x.error||'')+'">Failed</span>'}</td></tr>`).join('')||'<tr><td colspan="4" class="mute">No emails sent yet.</td></tr>'}</tbody></table></div>`}

/* Wiring */
const render1=render;render=function(){render1();const u=me();if(!u||st.loading||st.view==='setpw')return;
 if(u.role==='admin'&&st.tab==='overview'){document.querySelector('#app .stats')?.insertAdjacentHTML('afterend',activityPanel())}
 if(u.role==='grantee'&&st.tab==='overview'){const g=document.querySelector('.gr');if(g){g.querySelector('p')?.insertAdjacentHTML('beforeend',' <button class="link" style="color:#cfe0ff" data-mm="guide">Welcome guide</button>');if(!ls('lg_guide_hidden_'+u.id))g.insertAdjacentHTML('afterend',guideCard())}}};
document.addEventListener('click',e=>{if(e.target.closest('[data-a=enter]'))st.forceGuide=false;const b=e.target.closest('[data-mm]'),u=me();if(!b||!u)return;const a=b.dataset.mm,adm=u.role==='admin';
 if(a==='guide'){st.forceGuide=true;st.welcome=true;return render()}
 if(a==='hideGuide'){ls('lg_guide_hidden_'+u.id,'1');return $('#guideCard')?.remove()}
 if(a==='toMsg')return $('#privateArea')?.scrollIntoView({behavior:'smooth'});
 if(!adm)return;
 if(a==='shade'){if(e.target===b)closeMail();return}
 if(a==='close')return closeMail();
 if(a==='open')return openMail();
 if(a==='one')return openMail([b.dataset.id]);
 if(a==='sel')return SEL.size?openMail():toast('Select at least one grantee first');
 if(a==='lf'){LF=b.dataset.v;return redrawPanel()}
 if(a==='all'){lvis().forEach(x=>SEL.add(x.id));return redrawPanel()}
 if(a==='none'){SEL.clear();return redrawPanel()}
 if(a==='pick'||a==='mpick'){b.checked?SEL.add(b.value):SEL.delete(b.value);return a==='pick'?mmCount():(mmCount(),mmPrev())}
 if(a==='mall'){people.filter(x=>(x.name+x.email).toLowerCase().includes(MQ.toLowerCase())).forEach(x=>SEL.add(x.id));return mmList()}
 if(a==='mnone'){SEL.clear();return mmList()}
 if(a==='tab'){const h=b.dataset.v==='h';$('#mmC').style.display=h?'none':'';$('#mmH').style.display=h?'':'none';document.querySelectorAll('.mmt button').forEach(x=>x.classList.toggle('on',x===b));if(h)mmHistory();return}
 if(a==='retry'){SEL=new Set(b.dataset.ids.split(','));return mmList()}
 if(a==='send')return sendMail()});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='lq'){LQ=t.value;$('#lbody').innerHTML=lrows()}if(t.id==='mmQ'){MQ=t.value;mmList()}if(t.id==='mmS'||t.id==='mmB')mmPrev()});
document.addEventListener('change',e=>{if(e.target.id==='mmT')applyTpl(e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#mailModal'))closeMail()});

boot();

</script>
